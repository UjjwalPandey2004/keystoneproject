# Cloud profile: activate with SPRING_PROFILES_ACTIVE=cloud.
# Every secret still comes from environment variables / the platform's secret manager.

# One JSON object per log line, ready for CloudWatch / Cloud Logging / Azure Monitor / Loki.
logging.structured.format.console=ecs

# Behind a load balancer or ingress: trust X-Forwarded-* headers and finish in-flight requests on shutdown.
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Connection pool sized for a small managed PostgreSQL instance.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000

# Liveness/readiness endpoints for container platforms (Kubernetes, Cloud Run, ECS, App Service).
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
