spring.application.name=deliveryservice

# PostgreSQL and Flyway are the source of truth for the schema.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/keystone_db}
spring.datasource.username=${DB_USERNAME:keystone}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8080}
# Monitoring: /actuator/health is public (load balancer / uptime checks); info and metrics need a MANAGER token.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=MANAGER
management.info.env.enabled=true
info.app.name=KEYSTONE Field Service Management Platform
info.app.version=@project.version@
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=${MAIL_ENABLED:false}

# Required: there is deliberately no default, so a deployment cannot run with a known secret.
security.jwt.secret=${JWT_SECRET}

# Demo mode keeps the seeded accounts on their documented password and shows one-click logins.
# When off, seeded accounts still on that password are rotated at startup.
app.demo-mode=${DEMO_MODE:false}
app.bootstrap-admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
notifications.mail.enabled=${MAIL_ENABLED:false}
app.base-url=${APP_BASE_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Payments. UPI is offered only when UPI_VPA (e.g. keystone@okhdfcbank) is set.
app.payments.upi-vpa=${UPI_VPA:}
app.payments.payee-name=${UPI_PAYEE_NAME:KEYSTONE Facilities}

# Work-order photos/documents. In the cloud point STORAGE_DIR at a persistent volume or mounted bucket.
app.storage.dir=${STORAGE_DIR:./data/uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB